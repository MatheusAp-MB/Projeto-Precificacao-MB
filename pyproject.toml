[tool.poetry]
package-mode = false

[project]
name = "projeto-precificacao-mb"
version = "0.1.0"
description = ""
authors = [
    {name = "Matheus-Ap1",email = "matheusapmb@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "django (>=6.0.6,<7.0.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "mkdocs (>=1.6.1,<2.0.0)",
    "mysqlclient (>=2.2.8,<3.0.0)",
