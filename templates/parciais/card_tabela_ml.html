<div class="prec-tabela-header">
  <span class="prec-card-title" style="margin: 0;">
    <i class="fas fa-box"></i> Produtos
  </span>
  <input type="text" id="busca-produto" placeholder="Buscar produto ou SKU..."
         class="prec-busca" name="busca"
         value="{{ busca }}"
         hx-get="{% url 'precificacao_ml' %}"
         hx-trigger="input changed delay:300ms"
         hx-target="#card_tabela"
         hx-swap="innerHTML"
         hx-include="[name='busca']">
</div>

<div id="container-tabela">
  {% include 'parciais/tabela_produtos_ml.html' %}
</div>

<div id="container-paginacao">
  {% include 'parciais/paginacao_ml.html' %}
</div>
