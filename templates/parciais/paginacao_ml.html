<div class="paginacao">
  <span class="paginacao-info">
    {{ page_obj.start_index }}–{{ page_obj.end_index }} de {{ page_obj.paginator.count }} produtos
  </span>
  <div class="paginacao-btns">
    {% if page_obj.has_previous %}
      <button class="btn-pagina"
              hx-get="{% url 'precificacao_ml' %}?pagina={{ page_obj.previous_page_number }}&busca={{ busca }}"
              hx-target="#card_tabela"
              hx-swap="innerHTML">
        <i class="fas fa-chevron-left"></i> Anterior
      </button>
    {% endif %}
    <span class="paginacao-atual">Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
      <button class="btn-pagina"
              hx-get="{% url 'precificacao_ml' %}?pagina={{ page_obj.next_page_number }}&busca={{ busca }}"
              hx-target="#card_tabela"
              hx-swap="innerHTML">
        Próxima <i class="fas fa-chevron-right"></i>
      </button>
    {% endif %}
  </div>
</div>
